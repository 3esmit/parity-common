on:
  pull_request:
  push:
    branches:
      - master

name: Continuous integration

jobs:
  uint_macro:
    name: Uint macro (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, beta]
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Test generated API with std
        run: cargo test -p uint --test primitive_constants
      - name: Test generated API without std
        run: cargo test -p uint --no-default-features --test primitive_constants

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable

      - run: sudo apt-get install libclang-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable

      - name: Install Clang (Ubuntu)
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get install libclang-dev
      - name: Workaround macOS Clang
        if: ${{ runner.os == 'macOS' }}
        run: | 
          brew install llvm@15
          brew link llvm@15

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - run: rustup target add wasm32-unknown-unknown

      - name: Test no-default-features
        run: cargo test --workspace --no-default-features

      - name: Test default features
        run: cargo test --workspace

      - name: Test uint
        run: cargo test -p uint --all-features

      - name: Test fixed-hash no_std
        run: cargo test -p fixed-hash --no-default-features --features='rustc-hex'

      - name: Test fixed-hash all-features
        run: cargo test -p fixed-hash --all-features

      - name: Test primitive-types no_std
        run: cargo test -p primitive-types --no-default-features --features='scale-info,num-traits,serde_no_std'

      - name: Test primitive-types all-features
        run: cargo test -p primitive-types --all-features

      - name: Build ethereum-types no_std
        run: cargo build -p ethereum-types --no-default-features --features='serialize,rlp' --target=wasm32-unknown-unknown

      - name: Test ethereum-types all-features
        run: cargo test -p ethereum-types --all-features

      - name: Test ethbloom all-features
        run: cargo test -p ethbloom --all-features

      - name: Test bounded-collections no_std
        run: cargo test -p bounded-collections --no-default-features

      - name: Test bounded-collections no_std,serde
        run: cargo test -p bounded-collections --no-default-features --features=serde

      - name: Test bounded-collections all-features
        run: cargo test -p bounded-collections --all-features

  test_windows:
    name: Test Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - run: cargo test --workspace --exclude kvdb-rocksdb

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: nightly
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check
